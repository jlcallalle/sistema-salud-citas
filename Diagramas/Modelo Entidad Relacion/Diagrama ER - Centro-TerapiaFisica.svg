<text x="1000" y="1255" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="600">1:N</text>
<text x="1812.5" y="490" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="600">1:N</text>
<text x="1812.5" y="875" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="600">1:N</text>
<text x="130" y="695" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="600">1:N</text>
<text x="1250" y="1910" text-anchor="middle" dominant-baseline="middle" font-size="20">La autoría de sesiones, pagos y facturas también admite ausencia de usuario. Paciente en sesiones y pagos depende de las migraciones.</text>
<text x="1250" y="1950" text-anchor="middle" dominant-baseline="middle" font-size="20">Se muestran atributos principales. La relación azul propone patients.created_by; no se han aplicado cambios a la base de datos.</text>
<text x="1250" y="1990" text-anchor="middle" dominant-baseline="middle" font-size="20">No se incluyen relaciones 1:1 ni N:M porque no están declaradas en este modelo.</text>
