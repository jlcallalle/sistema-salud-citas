<text x="1250" y="1785" text-anchor="middle" dominant-baseline="middle" font-size="23" >Rectángulo: entidad · Rombo: relación · Óvalo: atributo · Subrayado: clave primaria · Línea azul discontinua: propuesta</text>
<text x="1250" y="1827" text-anchor="middle" dominant-baseline="middle" font-size="21" >1 = uno · N = muchos · 1:N = uno a muchos. Esta notación expresa la cardinalidad máxima; no indica obligatoriedad.</text>
<text x="1250" y="1870" text-anchor="middle" dominant-baseline="middle" font-size="19" >Obligatoria: toda cita pertenece a un paciente. Opcionales: usuario creador de pacientes y asociación de pagos con citas.</text>
