<text x="1250" y="103" text-anchor="middle" dominant-baseline="middle" font-size="22" >Notación Chen · Una sola representación por entidad · Cardinalidad máxima 1:N · Toda cita requiere un paciente · Autoría de pacientes propuesta</text>
